{% extends 'base.html' %}
{% block title %}Criar Conta - Nimbo{% endblock %}
{% block content %}
  <section class="form-card form-card-md">
    <a class="back-link" href="{% url 'contas_login' %}">
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <path d="M19 12H5m7 7-7-7 7-7"></path>
      </svg>
      Voltar
    </a>
    <h2 class="page-title">Criar Conta</h2>
    <form method="post">
      {% csrf_token %}
      {{ form.as_p }}
      <div class="form-actions form-actions-full">
        <button type="submit" class="button fill">Cadastrar-se</button>
      </div>
    </form>
    <div class="form-links">
      <a href="{% url 'contas_login' %}">Já possui uma conta? Entre aqui</a>
    </div>
  </section>
{% endblock %}
