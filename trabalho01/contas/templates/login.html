{% extends 'base.html' %}
{% block title %}Entrar - Nimbo{% endblock %}
{% block content %}
  <section class="form-card form-card-sm">
    <a class="back-link" href="{% url 'home' %}">
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <path d="M19 12H5m7 7-7-7 7-7"></path>
      </svg>
      Voltar
    </a>
    <h2 class="page-title">Entrar</h2>
    <form method="post">
      {% csrf_token %}
      {{ form.as_p }}
      <div class="form-actions form-actions-full">
        <button type="submit" class="button fill">Entrar</button>
      </div>
    </form>
    <div class="form-links">
      <a href="{% url 'password_reset' %}">Esqueceu sua senha?</a>
      <a href="{% url 'cadastro_contas' %}">Não tem uma conta? Cadastre-se</a>
    </div>
  </section>
{% endblock %}
