{% extends 'base.html' %}
{% block title %}Editar Integrante - Nimbo{% endblock %}
{% block content %}
  <section class="form-card" style="max-width: 700px; margin: 40px auto;">
    <div class="topbar"></div>
    <h2 class="page-title">Editar Integrante</h2>
    {% if supabase_disponivel and integrante %}
      <img src="{{ integrante.foto_url }}" alt="{{ integrante.nome }}" style="width: 180px; height: 180px; object-fit: cover; border-radius: 18px; margin-bottom: 16px;" />
      <form method="post">
        {% csrf_token %}
        <label>Nome</label>
        <input type="text" name="nome" value="{{ integrante.nome }}" required />
        <label>Cargo</label>
        <input type="text" name="cargo" value="{{ integrante.cargo }}" required />
        <label>Biografia</label>
        <textarea name="biografia" rows="5" required>{{ integrante.biografia }}</textarea>
        <label>URL da foto</label>
        <input type="url" name="foto_url" value="{{ integrante.foto_url }}" />
        <button type="submit" class="button fill" style="margin-top: 18px;">Salvar</button>
      </form>
    {% else %}
      <p>Não foi possível carregar o integrante.</p>
    {% endif %}
  </section>
{% endblock %}
