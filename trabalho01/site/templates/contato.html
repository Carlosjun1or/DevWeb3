{% extends 'base.html' %}
{% block title %}Contato - Nimbo{% endblock %}
{% block content %}
  <section class="form-card" style="max-width: 700px; margin: 40px auto;">
    <div class="topbar"></div>
    <h2 class="page-title">Contato</h2>
    <form method="post">
      {% csrf_token %}
      {{ form.as_p }}
      <button type="submit" class="button fill" style="width: 100%;">Enviar mensagem</button>
    </form>
  </section>
{% endblock %}
