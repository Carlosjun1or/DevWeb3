{% load static %}

<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block titulo %} LojaFake.com {% endblock %}</title>
    <link rel="icon" type="image/svg+xml" href="{% static 'images/mercado.svg' %}">
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
    {% block estilos %}{% endblock %}
</head>

<body>
    <header>
        <a href="{% url 'produtos' %}" class="brand-link" aria-label="Ir para a página inicial">
            <div class="brand">
                <img src="{% static 'images/mercado.svg' %}" alt="Ícone de mercearia" class="brand-icon">
                <h1>LojaFake.com</h1>
            </div>
        </a>
        <nav>
            <a href="{% url 'index' %}">Quem somos</a>
            <a href="{% url 'produtos' %}">Produtos</a>
            <a href="{% url 'servicos' %}">Serviços</a>
            <a href="{% url 'novoContato' %}">Novo Contato</a>
            <a href="{% url 'contatos' %}">Contatos</a>
            <a href="{% url 'login' %}">Login</a>
            {% if user.is_authenticated %}
                <a href="{% url 'dashboard' %}">Dashboard</a>
                <a href="{% url 'perfil' %}">Perfil</a>
                <form method="post" action="{% url 'logout' %}" style="display: inline;">
                    {% csrf_token %}
                    <button type="submit" class="logout-button">Logout</button>
                </form>
            {% endif %}
        </nav>
    </header>
    <main>
        {% block conteudo %}
        {% endblock %}
    </main>
</body>

</html>
