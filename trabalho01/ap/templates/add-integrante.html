{% extends 'template.html' %}

{% load static %}

{% block titulo %} Adicionar Integrante {% endblock %}

{% block estilos %}
<link rel="stylesheet" href="{% static 'css/form-integrante.css' %}">
{% endblock %}

{% block conteudo %}

    <h2 class="form-titulo">Novo Integrante</h2>

    <div class="form-container">
        <form method="post" action="{% url 'addIntegrante' %}" class="integrante-form">
            {% csrf_token %}

            <div class="campo">
                <label for="nome">Nome:</label>
                <input type="text" id="nome" name="nome" placeholder="Nome completo" required>
            </div>

            <div class="campo">
                <label for="cargo">Cargo:</label>
                <input type="text" id="cargo" name="cargo" placeholder="Ex: Desenvolvedor, Designer…" required>
            </div>

            <div class="campo">
                <label for="biografia">Biografia:</label>
                <textarea id="biografia" name="biografia" placeholder="Descreva brevemente este integrante…" required></textarea>
            </div>

            <div class="campo">
                <label for="foto_url">URL da Foto:</label>
                <input type="url" id="foto_url" name="foto_url" placeholder="https://exemplo.com/foto.jpg">
            </div>

            <button type="submit">Adicionar Integrante</button>
        </form>
    </div>

{% endblock %}
