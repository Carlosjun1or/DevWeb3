{% extends 'base.html' %}
{% block title %}Editar Serviço - Nimbo{% endblock %}
{% block content %}
  <section class="form-card" style="max-width: 760px; margin: 30px auto;">
    <div class="topbar"></div>
    <a class="back-link" href="{% url 'servicos_admin' %}">
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <path d="M19 12H5m7 7-7-7 7-7"></path>
      </svg>
      Voltar
    </a>
    <h2 class="page-title">Editar Serviço</h2>
    <form method="post" enctype="multipart/form-data">
      {% csrf_token %}
      {{ form.as_p }}
      <button type="submit" class="button fill">Salvar</button>
    </form>
  </section>
{% endblock %}
