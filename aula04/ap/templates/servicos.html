{% extends 'template.html' %}

{% block titulo %} Serviços {% endblock %}

{%block conteudo %}

    <h2>Serviços</h2>
    <table border="1">
        <tr>
            <th>Nome</th>
            <th>Descrição</th>
            <th>Preço</th>
            <th>Imagem</th>
            <th colspan="2">Ações</th>
        </tr>

        {% for servico in servicos %}
        <tr>
            <td>{{ servico.nome }}</td>
            <td>{{ servico.descricao }}</td>
            <td>{{ servico.preco }}</td>
            <td>
                <img src="media/{{ servico.imagem }}" alt="{{ servico.nome }}" width="100">
            </td>
            <td>
                <a href="{% url 'excluirServico' servico.id %}" style="color: red;">Excluir</a>
            </td>
            <td>
                <a href="{% url 'editarServico' servico.id %}" style="color: blue;">Editar</a>
            </td>
        </tr>
        {% endfor %}
    </table>
    <p><a href="{% url 'addServico' %}" style="color: rgb(0, 74, 37);">Adicionar Serviço</a></p>

{% endblock %}
